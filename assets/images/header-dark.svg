<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="100%" height="200">
  <defs>
    <pattern id="grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#28303c" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>
    <linearGradient id="fade-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8aa8cf" stop-opacity="1" />
      <stop offset="100%" stop-color="#8aa8cf" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="960" height="200" fill="#090b0f" rx="8" />
  <rect width="960" height="200" fill="url(#grid-dark)" rx="8" opacity="0.4" />
  <rect x="0" y="0" width="960" height="200" fill="none" stroke="#28303c" stroke-width="1.5" rx="8" />
  
  <!-- Accent top line -->
  <line x1="48" y1="36" x2="160" y2="36" stroke="url(#fade-dark)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Subtitle pill / role -->
  <text x="48" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.25em" fill="#8aa8cf" text-transform="uppercase">
    BS INFORMATION TECHNOLOGY • WEB &amp; MOBILE DEVELOPMENT
  </text>
  
  <!-- Main Name -->
  <text x="48" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="300" letter-spacing="-0.02em" fill="#e6e9ef">
    Edgar Dominic Madlangbayan<tspan fill="#8aa8cf" font-weight="600">.</tspan>
  </text>
  
  <!-- Bio tagline -->
  <text x="48" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa4b3">
    FEU Institute of Technology • Makati, Philippines • Fourth-Year Student Developer
  </text>
</svg>
